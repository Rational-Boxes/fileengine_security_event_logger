[project]
name = "audit-service"
version = "0.1.0"
description = "FileEngine audit writer — the single deployment-wide consumer that drains the aggregating security-event sink into per-tenant audit_log tables"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "James Hickman", email = "james@rationalboxes.com"}]
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    # The core's accountability pull (§4.3) is a gRPC read. The generated stubs
    # come from the python_interface SDK, which is the one place the proto is
    # compiled for Python; resolved by relative path like the other services here.
    "grpcio>=1.50",
    "protobuf>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
# The query/export/verify HTTP API (§9). Optional: the consumer + verify CLI work
# without it (api.py is only imported by the audit-api entry point).
api = ["fastapi>=0.110", "uvicorn[standard]>=0.30"]
# The retention/archival job (§7): Fernet encryption + optional S3.
retention = ["cryptography>=40", "boto3>=1.26"]

[project.scripts]
audit-consumer = "audit_service.consumer:main"
audit-verify = "audit_service.verify:main"
audit-api = "audit_service.api:main"
audit-retention = "audit_service.retention:main"
audit-rules = "audit_service.engine:main"
# The guarantee path for core security records: drains the core's
# accountability table by cursor, independently of Redis (§4.3).
audit-accountability = "audit_service.poller:main"
# Inspect and clear an integrity halt. The deliberate human step the
# proposal asks for: a chain stays stopped until an operator says so.
audit-accountability-ack = "audit_service.poller:acknowledge_main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["live: integration test that needs Redis + Postgres reachable"]
testpaths = ["src/tests"]
